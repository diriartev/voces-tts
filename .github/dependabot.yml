# Dependabot: avisa (con pull request) cuando hay actualizaciones.
# Cada PR pasa por el CI completo antes de que lo aceptes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Dependencias de Python: solo PRs de SEGURIDAD (las versiones están fijadas a
  # propósito porque fairseq/RVC son delicados con las actualizaciones)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
